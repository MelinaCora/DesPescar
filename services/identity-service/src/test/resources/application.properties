spring.datasource.url=jdbc:h2:mem:despescar_identity_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=test-secret-key-for-ci-identity-service-1234567890
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
security.login.max-attempts=5
security.login.lock-duration-ms=900000
