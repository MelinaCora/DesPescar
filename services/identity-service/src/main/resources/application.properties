spring.application.name=identity-service

# DATABASE
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/despescar_identity?sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:despescar_dev}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# MYSQL DRIVER
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# GOOGLE (ingreso con Google): client id OAuth de tipo Web; vacio = boton deshabilitado
google.client-id=${GOOGLE_CLIENT_ID:}

# LOGIN SECURITY
security.login.max-attempts=5
security.login.lock-duration-ms=900000

# SERVER
server.port=8080