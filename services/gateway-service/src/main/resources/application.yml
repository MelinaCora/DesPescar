spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: identity-auth
          uri: http://localhost:8080
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/?(?<segment>.*), /auth/$\{segment}
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: identity-users
          uri: http://localhost:8080
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/?(?<segment>.*), /users/$\{segment}
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: flights
          uri: http://localhost:8081
          predicates:
            - Path=/api/flights/**,/api/airlines/**,/api/airports/**,/api/fares/**
          filters:
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: hotels-direct
          uri: http://localhost:8083
          predicates:
            - Path=/hoteles/**
          filters:
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: hotels-api
          uri: http://localhost:8083
          predicates:
            - Path=/api/hotels/**
          filters:
            - RewritePath=/api/hotels(?<segment>/?.*), /hoteles$\{segment}
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: packages
          uri: http://localhost:8086
          predicates:
            - Path=/api/packages/**
          filters:
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: reservations
          uri: http://localhost:8085
          predicates:
            - Path=/api/bookings/**
          filters:
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: extra-baggage
          uri: http://localhost:8085
          predicates:
            - Path=/api/extra-baggage/**
          filters:
            - RewritePath=/api/extra-baggage/?(?<segment>.*), /extra-baggage/$\{segment}
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: payments
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/unavailable
        - id: koi-ia
          uri: http://localhost:8088
          predicates:
            - Path=/api/koi/**
          metadata:
            response-timeout: 30000
            connect-timeout: 3000
          filters:
            - name: CircuitBreaker
              args:
                name: koiCircuitBreaker
                fallbackUri: forward:/fallback/unavailable

server:
  port: 8087

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,httpexchanges

jwt:
  secret: ${JWT_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      gatewayCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
      koiCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    instances:
      koiCircuitBreaker:
        timeoutDuration: 31s
        cancelRunningFuture: true
      gatewayCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true

gateway:
  rate-limit:
    requests-per-minute: 120
    koi-messages-per-minute: 10
    # Consultar y sumarse a pagos en grupo (por IP); el enlace no se adivina, pero se frena el barrido
    grupo-requests-per-minute: 20
    # IPs de proxies/balanceadores (separadas por coma) cuyo X-Forwarded-For se acepta; vacio = nunca
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}