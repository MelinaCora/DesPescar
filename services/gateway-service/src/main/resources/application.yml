spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s
      default-filters:
        - name: CircuitBreaker
          args:
            name: gatewayCircuitBreaker
            fallbackUri: forward:/fallback/unavailable
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/?(?<segment>.*), /auth/$\{segment}

        - id: identity-users
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/?(?<segment>.*), /users/$\{segment}

        - id: flights
          uri: ${FLIGHT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/flights/**,/api/airlines/**,/api/airports/**,/api/fares/**

        - id: hotels-direct
          uri: ${HOTEL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/hoteles/**

        - id: hotels-api
          uri: ${HOTEL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/hotels/**
          filters:
            - RewritePath=/api/hotels/?(?<segment>.*), /hoteles/$\{segment}

        - id: packages
          uri: ${PACKAGE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/packages/**

        - id: reservations
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/bookings/**

        - id: extra-baggage
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/extra-baggage/**
          filters:
            - RewritePath=/api/extra-baggage/?(?<segment>.*), /extra-baggage/$\{segment}

        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**

        - id: koi-ia
          uri: ${KOI_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/koi/**

server:
  port: 8087

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,httpexchanges

jwt:
  secret: ${JWT_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      gatewayCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    instances:
      gatewayCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true

gateway:
  rate-limit:
    requests-per-minute: 120