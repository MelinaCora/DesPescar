spring.application.name=package-service

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/despescar_package?sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:despescar_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

jwt.secret=${JWT_SECRET}

server.port=8086
