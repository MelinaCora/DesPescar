spring.application.name=koi-ia-service

spring.datasource.url=jdbc:mysql://localhost:3306/despescar_koiia
spring.datasource.username=root
spring.datasource.password=sqlrootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8088

koi.catalog.package-service-url=http://localhost:8086
koi.catalog.flight-service-url=http://localhost:8081
koi.catalog.hotel-service-url=http://localhost:8083

# Integracion opcional con Ollama (LLM local, sin costo por uso).
# Si koi.ai.enabled=false, KOI funciona 100% con su motor de reglas (regex + memoria de sesion).
# Si esta en true, el LLM complementa la extraccion de datos y humaniza las respuestas,
# pero nunca decide precios/paquetes: esos datos siempre vienen de los microservicios.
koi.ai.enabled=false
koi.ai.ollama.base-url=http://localhost:11434
koi.ai.ollama.model=llama3.2
koi.ai.ollama.timeout-ms=8000

springdoc.swagger-ui.path=/swagger-ui.html
