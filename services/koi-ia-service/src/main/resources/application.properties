spring.application.name=koi-ia-service

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/despescar_koiia?sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:despescar_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

server.port=8088

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

koi.catalog.package-service-url=${PACKAGE_SERVICE_URL:http://localhost:8086}
koi.catalog.flight-service-url=${FLIGHT_SERVICE_URL:http://localhost:8081}
koi.catalog.hotel-service-url=${HOTEL_SERVICE_URL:http://localhost:8083}

# --- CONSIGUE LA API KEY DE GROK ATRAVÉS DE ESTA PÁGINA https://console.groq.com/home
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.2

springdoc.swagger-ui.path=/swagger-ui.html