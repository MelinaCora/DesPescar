spring.application.name=payment-service
jwt.secret=${JWT_SECRET}

spring.datasource.url=jdbc:mysql://localhost:3306/despescar_payment
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:despescar_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8084

reservation-service.url=${RESERVATION_SERVICE_URL:http://localhost:8085}
reservation-service.connection-timeout-ms=3000
reservation-service.read-timeout-ms=5000
reservation-service.confirmation-read-timeout-ms=${RESERVATION_CONFIRMATION_READ_TIMEOUT_MS:15000}
reservation-service.sync-token=${RESERVATION_SERVICE_SYNC_TOKEN:}
# Token que reservation-service manda para pedir los reembolsos de un pago en grupo (CB5).
payment-service.sync-token=${PAYMENT_SERVICE_SYNC_TOKEN:}

# Proveedor de pagos: mock (por defecto, aprueba desde /pago/simulado del front), mercadopago
# (Checkout Pro: redirige a Mercado Pago) o mercadopago_orders (Checkout API via Orders: tarjeta
# tokenizada con MercadoPago.js en /pago/mercadopago y cobro con POST /v1/orders).
payments.provider=${PAYMENT_PROVIDER:mock}
payments.front-url=${FRONT_URL:http://localhost:5173}

# Con payments.provider=mercadopago o mercadopago_orders (credenciales de prueba de Mercado Pago).
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
# Solo con mercadopago_orders: public key que se entrega al front (GET /api/payments/config).
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.orders.base-url=${MERCADOPAGO_ORDERS_BASE_URL:https://api.mercadopago.com}
mercadopago.connection-timeout-ms=${MERCADOPAGO_CONNECTION_TIMEOUT_MS:5000}
mercadopago.socket-timeout-ms=${MERCADOPAGO_SOCKET_TIMEOUT_MS:15000}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
mercadopago.checkout.success-url=${MERCADOPAGO_SUCCESS_URL:${payments.front-url}/pago/resultado}
mercadopago.checkout.pending-url=${MERCADOPAGO_PENDING_URL:${payments.front-url}/pago/resultado}
mercadopago.checkout.failure-url=${MERCADOPAGO_FAILURE_URL:${payments.front-url}/pago/resultado}
