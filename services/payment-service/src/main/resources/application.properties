spring.application.name=payment-service
jwt.secret=${JWT_SECRET}


mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/despescar_payment?sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:despescar_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

server.port=8084

reservation-service.url=${RESERVATION_SERVICE_URL:http://localhost:8085}
reservation-service.connection-timeout-ms=3000
reservation-service.read-timeout-ms=5000
reservation-service.sync-token=${RESERVATION_SERVICE_SYNC_TOKEN:}

mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
mercadopago.checkout.success-url=${MERCADOPAGO_SUCCESS_URL:}
mercadopago.checkout.pending-url=${MERCADOPAGO_PENDING_URL:}
mercadopago.checkout.failure-url=${MERCADOPAGO_FAILURE_URL:}