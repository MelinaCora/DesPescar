spring.application.name=reservation-service

spring.datasource.url=jdbc:mysql://localhost:3306/despescar_reservation
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:despescar_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8085

jwt.secret=${JWT_SECRET}

flight-service.url=http://localhost:8081
flight-service.connection-timeout-ms=3000
flight-service.read-timeout-ms=5000

hotel-service.url=http://localhost:8083
hotel-service.connection-timeout-ms=3000
hotel-service.read-timeout-ms=5000

package-service.url=http://localhost:8086
package-service.connection-timeout-ms=3000
package-service.read-timeout-ms=5000

payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8084}
payment-service.connection-timeout-ms=3000
payment-service.read-timeout-ms=10000
# Token con el que este servicio llama a la API interna de payment-service (reembolsos de grupos)
payment-service.sync-token=${PAYMENT_SERVICE_SYNC_TOKEN:}

# Pago en grupo: cuanto puede quedar un grupo pagado completo sin que se confirme la reserva antes de
# cancelarlo y reembolsar todas las partes
grupo-pago.plazo-confirmacion=${GRUPO_PAGO_PLAZO_CONFIRMACION:30m}

reservation-service.sync-token=${RESERVATION_SERVICE_SYNC_TOKEN:}

inventory.sync-token=${INVENTORY_SERVICE_TOKEN:}

# Sin sesion abierta durante todo el pedido: cada transaccion relee la reserva fresca (la confirmacion
# del pago y los cambios del carrito la releen bloqueada despues de llamar al hotel)
spring.jpa.open-in-view=false
