spring.application.name=reservation-service

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/despescar_reservation?sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:despescar_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

server.port=8085

jwt.secret=${JWT_SECRET}

flight-service.url=${FLIGHT_SERVICE_URL:http://localhost:8081}
flight-service.connection-timeout-ms=3000
flight-service.read-timeout-ms=5000

hotel-service.url=${HOTEL_SERVICE_URL:http://localhost:8083}
hotel-service.connection-timeout-ms=3000
hotel-service.read-timeout-ms=5000

package-service.url=${PACKAGE_SERVICE_URL:http://localhost:8086}
package-service.connection-timeout-ms=3000
package-service.read-timeout-ms=5000

reservation-service.sync-token=${RESERVATION_SERVICE_SYNC_TOKEN:}

inventory.sync-token=${INVENTORY_SERVICE_TOKEN:}
